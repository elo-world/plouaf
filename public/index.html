<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0040FF" />
        <meta
            name="description"
            content="plouaf! is a simple web app that lets users make random selections in multiple languages. You can, for example, pick a name at random, flip a coin, roll a die, or generate a random number."
        />

        <!-- Icon -->
        <link rel="icon" href="%PUBLIC_URL%/images/icons/website/favicon.ico" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/icons/website/apple-touch-icon.png" />

        <!-- Manifest -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <!-- Images -->
        <link rel="preload" as="image" href="%PUBLIC_URL%/images/logo/typo.svg" />
        <link rel="preload" as="image" href="%PUBLIC_URL%/images/menu/random-draw.svg" />
        <link rel="preload" as="image" href="%PUBLIC_URL%/images/menu/heads-or-tails.svg" />
        <link rel="preload" as="image" href="%PUBLIC_URL%/images/menu/die.svg" />
        <link rel="preload" as="image" href="%PUBLIC_URL%/images/menu/random-number-generator.svg" />

        <!-- Title -->
        <title>plouaf !</title>

        <!-- Service Worker -->
        <script>
            window.addEventListener("load", () => {
                if ("serviceWorker" in navigator) {
                    navigator.serviceWorker.register("%PUBLIC_URL%/sw.js");
                }
            });
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
